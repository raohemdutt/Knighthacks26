[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "fastapi",
    "uvicorn",
    "websockets",  # uvicorn serves /ws only when a WebSocket library is installed
    "httpx",
    "pyyaml",
    "mcp>=1.20,<2",
    "icalendar>=6",
    "recurring-ical-events>=3",
    "cryptography>=42",
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest"]
# Browser connector (K7). After install: python -m patchright install chromium
browser = ["patchright>=1.50"]
# Circle's Neon Postgres store and outbox sync (N1)
neon = ["psycopg[binary]>=3.2"]

[tool.setuptools.packages.find]
include = ["contracts*", "runtime*", "bus*", "contexts*"]

[tool.pytest.ini_options]
testpaths = ["tests", "contexts"]
