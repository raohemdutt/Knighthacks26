[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "fastapi",
    "uvicorn",
    "httpx",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["contracts*", "runtime*", "bus*", "contexts*"]

[tool.pytest.ini_options]
testpaths = ["tests", "contexts"]
