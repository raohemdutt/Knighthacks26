<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <link rel="stylesheet" href="world/soft.css" />
      <style>
        #root { position: absolute; inset: 0; font-family: var(--font); }
        #slot-5-title { position: absolute; left: 160px; top: 120px; display: flex; align-items: center; gap: 48px; }
        #slot-5-key { transform-origin: center; }
        #slot-5-name { opacity: 0; }
      </style>
      <div id="root" data-composition-id="slot-5" data-width="1920" data-height="1080">
        <div id="slot-5-title">
          <div id="slot-5-key" class="soft-key">5</div>
          <div id="slot-5-name" class="soft-title">On the Jetson</div>
        </div>
      </div>
      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          tl.fromTo("#slot-5-key", { boxShadow: "18px 18px 36px #b7c0cd, -18px -18px 36px #ffffff" },
            { boxShadow: "inset 10px 10px 20px #b7c0cd, inset -10px -10px 20px #ffffff", duration: 0.35, ease: "power2.in" }, 0.1);
          tl.fromTo("#slot-5-name", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 0.3);
          tl.to("#slot-5-name", { opacity: 0, duration: 0.5, ease: "power2.in" }, 6.0);
          tl.to("#slot-5-key", { scale: 0.6, x: -40, y: -40, duration: 0.6, ease: "power2.inOut" }, 6.0);
          window.__timelines["slot-5"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
