        <div class="clip cap" id="cap-problem-0" data-start="1.000" data-duration="4.282" data-track-index="0"><div class="cap-card soft-raised"><div class="cap-text soft-body">Your day lives in a dozen apps, and none of them sees how it actually goes.</div></div></div>
        <div class="clip cap" id="cap-problem-1" data-start="5.332" data-duration="5.386" data-track-index="0"><div class="cap-card soft-raised"><div class="cap-text soft-body">This is Atlas: a personal AI computer that sees your day, and keeps it on the device.</div></div></div>
        <div class="clip cap" id="cap-intro-0" data-start="13.268" data-duration="6.970" data-track-index="0"><div class="cap-card soft-raised"><div class="cap-text soft-body">Inside: a camera, a speaker, and a Jetson that runs the vision, the memory, and an agent that acts for you.</div></div></div>
        <div class="clip cap" id="cap-morning-0" data-start="22.988" data-duration="2.122" data-track-index="0"><div class="cap-card soft-raised"><div class="cap-text soft-body"><span class="cap-who">Hemdutt</span>Good morning.</div></div></div>
        <div class="clip cap" id="cap-morning-1" data-start="25.160" data-duration="4.618" data-track-index="0"><div class="cap-card soft-raised"><div class="cap-text soft-body"><span class="cap-who">Atlas</span>Good morning. Seven and a half hours, right on your usual.</div></div></div>
        <div class="clip cap" id="cap-morning-2" data-start="30.328" data-duration="5.938" data-track-index="0"><div class="cap-card soft-raised"><div class="cap-text soft-body"><span class="cap-who">Atlas</span>Big day. Your mentor check-in is at 9:20 in Engineering II, so leave by ten past.</div></div></div>
        <div class="clip cap" id="cap-morning-3" data-start="36.316" data-duration="7.474" data-track-index="0"><div class="cap-card soft-raised"><div class="cap-text soft-body"><span class="cap-who">Atlas</span>Submissions close at 11, judging's at noon, and Maya's study session is at 2. Your algorithms writeup is due Tuesday night.</div></div></div>
        <div class="clip cap" id="cap-morning-4" data-start="43.840" data-duration="3.946" data-track-index="0"><div class="cap-card soft-raised"><div class="cap-text soft-body"><span class="cap-who">Atlas</span>And if you want a break, Sam and Riley are at board game night at 8.</div></div></div>
        <div class="clip cap" id="cap-morning-5" data-start="47.836" data-duration="3.322" data-track-index="0"><div class="cap-card soft-raised"><div class="cap-text soft-body"><span class="cap-who">Atlas</span>Does this look good, or would you like something changed?</div></div></div>
        <div class="clip cap" id="cap-morning-6" data-start="51.208" data-duration="3.226" data-track-index="0"><div class="cap-card soft-raised"><div class="cap-text soft-body"><span class="cap-who">Hemdutt</span>Looks good. And help me eat two real meals today.</div></div></div>
        <div class="clip cap" id="cap-morning-7" data-start="54.484" data-duration="3.442" data-track-index="0"><div class="cap-card soft-raised"><div class="cap-text soft-body"><span class="cap-who">Atlas</span>Done. I'll keep track of the meals.</div></div></div>
        <div class="clip cap" id="cap-morning-8" data-start="57.976" data-duration="2.122" data-track-index="0"><div class="cap-card soft-raised"><div class="cap-text soft-body"><span class="cap-who">Hemdutt</span>Atlas, where are my keys?</div></div></div>
        <div class="clip cap" id="cap-morning-9" data-start="60.148" data-duration="4.426" data-track-index="0"><div class="cap-card soft-raised"><div class="cap-text soft-body"><span class="cap-who">Atlas</span>Behind the mug on your desk. You left them there last night.</div></div></div>
        <div class="clip cap" id="cap-sources-0" data-start="67.624" data-duration="6.874" data-track-index="0"><div class="cap-card soft-raised"><div class="cap-text soft-body">That brief came from your watch, calendars, chats and the campus map, written on the Jetson in under three seconds.</div></div></div>
        <div class="clip cap" id="cap-sources-1" data-start="74.548" data-duration="7.546" data-track-index="0"><div class="cap-card soft-raised"><div class="cap-text soft-body">And what the camera sees becomes events, then moments it remembers, then answers, and, with your OK, the examples it learns from.</div></div></div>
        <div class="clip cap" id="cap-model-0" data-start="83.644" data-duration="7.426" data-track-index="0"><div class="cap-card soft-raised"><div class="cap-text soft-body">A four-billion-parameter Qwen runs right here: fast, accurate, and private. Forty-eight demo questions, forty-eight right.</div></div></div>
        <div class="clip cap" id="cap-desk-0" data-start="92.620" data-duration="6.610" data-track-index="0"><div class="cap-card soft-raised"><div class="cap-text soft-body"><span class="cap-who">Atlas</span>You look tired: the look you get after a long stretch without moving. You've been sitting an hour and forty-five minutes.</div></div></div>
        <div class="clip cap" id="cap-desk-1" data-start="99.280" data-duration="4.594" data-track-index="0"><div class="cap-card soft-raised"><div class="cap-text soft-body"><span class="cap-who">Atlas</span>Your writeup's due Tuesday, and Maya says half the grade is the runtime analysis.</div></div></div>
        <div class="clip cap" id="cap-desk-2" data-start="103.924" data-duration="7.306" data-track-index="0"><div class="cap-card soft-raised"><div class="cap-text soft-body"><span class="cap-who">Atlas</span>But first: that's your third energy drink, over your limit, and no water in ninety minutes. Go fill your bottle and take a walk.</div></div></div>
        <div class="clip cap" id="cap-faces-0" data-start="113.780" data-duration="10.282" data-track-index="0"><div class="cap-card soft-raised"><div class="cap-text soft-body">If you turn it on, Atlas reads your expressions on the device, to coach you and to train your own model. You see yourself clear on your own screen. Saved pictures are blurred, and so is anything that leaves.</div></div></div>
        <div class="clip cap" id="cap-kitchen-0" data-start="126.112" data-duration="4.930" data-track-index="0"><div class="cap-card soft-raised"><div class="cap-text soft-body"><span class="cap-who">Atlas</span>Hold on: cans go in recycling at UCF. The blue one.</div></div></div>
        <div class="clip cap" id="cap-kitchen-1" data-start="132.592" data-duration="6.274" data-track-index="0"><div class="cap-card soft-raised"><div class="cap-text soft-body"><span class="cap-who">Atlas</span>Right bin. Five of seven this week, seventy-one percent. Your goal's eighty.</div></div></div>
        <div class="clip cap" id="cap-sorttech-0" data-start="140.416" data-duration="11.938" data-track-index="0"><div class="cap-card soft-raised"><div class="cap-text soft-body">The kitchen camera runs a YOLO detector at forty-one frames a second and tracks every item. The bin rules are UCF's own, and every impact number cites its source. Only counts leave the box.</div></div></div>
        <div class="clip cap" id="cap-sorttech-1" data-start="152.404" data-duration="5.242" data-track-index="0"><div class="cap-card soft-raised"><div class="cap-text soft-body">The look guide follows your eyes to point the way, and those frames never leave the browser.</div></div></div>
        <div class="clip cap" id="cap-lab-0" data-start="159.196" data-duration="10.402" data-track-index="0"><div class="cap-card soft-raised"><div class="cap-text soft-body">The lab is two AMD Strix Halo pods. One fine-tunes your own model on your own examples. The other, with everyone's consent, learns from all of them, so every Atlas gets better.</div></div></div>
        <div class="clip cap" id="cap-lab-1" data-start="169.648" data-duration="8.578" data-track-index="0"><div class="cap-card soft-raised"><div class="cap-text soft-body">A test decides if the new model ships. When one passes, it goes up on Hugging Face, and the box checks it, swaps it in live, and rolls back if anything fails.</div></div></div>
        <div class="clip cap" id="cap-device-0" data-start="179.776" data-duration="9.514" data-track-index="0"><div class="cap-card soft-raised"><div class="cap-text soft-body">Pull the network cable: it keeps seeing, remembering and answering, out loud, on the box. Only learning pauses. When the cameras are busy, your question still goes first.</div></div></div>
        <div class="clip cap" id="cap-device-1" data-start="189.340" data-duration="3.898" data-track-index="0"><div class="cap-card soft-raised"><div class="cap-text soft-body">And a ledger shows what left: thirteen allowed, thirteen blocked.</div></div></div>
        <div class="clip cap" id="cap-league-0" data-start="194.788" data-duration="3.850" data-track-index="0"><div class="cap-card soft-raised"><div class="cap-text soft-body"><span class="cap-who">Dominick</span>Board game night at the Union. Eight o'clock.</div></div></div>
        <div class="clip cap" id="cap-league-1" data-start="200.188" data-duration="7.186" data-track-index="0"><div class="cap-card soft-raised"><div class="cap-text soft-body"><span class="cap-who">Atlas</span>Ilan's at '63 South, and you're free till 8:30. Dinner? It'd be your second real meal.</div></div></div>
        <div class="clip cap" id="cap-league-2" data-start="207.424" data-duration="2.122" data-track-index="0"><div class="cap-card soft-raised"><div class="cap-text soft-body"><span class="cap-who">Hemdutt</span>Yeah, tell him I'm coming.</div></div></div>
        <div class="clip cap" id="cap-league-3" data-start="210.096" data-duration="2.314" data-track-index="0"><div class="cap-card soft-raised"><div class="cap-text soft-body"><span class="cap-who">Atlas</span>Logged: goal met.</div></div></div>
        <div class="clip cap" id="cap-friends-0" data-start="213.960" data-duration="8.074" data-track-index="0"><div class="cap-card soft-raised"><div class="cap-text soft-body">Each box reads only its own calendar and answers in one word. They meet in a Neon database that holds only what each person chose to share.</div></div></div>
        <div class="clip cap" id="cap-friends-1" data-start="222.084" data-duration="7.714" data-track-index="0"><div class="cap-card soft-raised"><div class="cap-text soft-body">In a group you trust, friends can let their boxes recognise each other, and learn from each other's examples, and every group runs its own network.</div></div></div>
        <div class="clip cap" id="cap-lives-0" data-start="231.348" data-duration="6.826" data-track-index="0"><div class="cap-card soft-raised"><div class="cap-text soft-body">Not just for students: a night-shift worker's upside-down day, a family's chores, a plant floor, at twelve watts idle.</div></div></div>
        <div class="clip cap" id="cap-plant-0" data-start="239.724" data-duration="9.754" data-track-index="0"><div class="cap-card soft-raised"><div class="cap-text soft-body">Point the same box at a plant and the same pieces line up. The brief becomes a shift triage. The pointer that found your keys walks a floor plan, over paths SPOT has actually walked.</div></div></div>
        <div class="clip cap" id="cap-plant-1" data-start="249.528" data-duration="8.818" data-track-index="0"><div class="cap-card soft-raised"><div class="cap-text soft-body">Every number is computed from the inspection rows and cites them. And the lab re-trains the model on the plant's own data and tests it before it's allowed on the box.</div></div></div>
        <div class="clip cap" id="cap-shift-0" data-start="259.396" data-duration="3.490" data-track-index="0"><div class="cap-card soft-raised"><div class="cap-text soft-body"><span class="cap-who">Xander</span>Morning, Atlas. What should I check first?</div></div></div>
        <div class="clip cap" id="cap-shift-1" data-start="262.936" data-duration="10.930" data-track-index="0"><div class="cap-card soft-raised"><div class="cap-text soft-body"><span class="cap-who">Atlas</span>Three things. First, heat exchanger 2. Its alarm came from a check that failed, and it hasn't had a good check in 88 hours. Send SPOT back before you send anyone.</div></div></div>
        <div class="clip cap" id="cap-shift-2" data-start="273.916" data-duration="2.122" data-track-index="0"><div class="cap-card soft-raised"><div class="cap-text soft-body"><span class="cap-who">Xander</span>Where is it?</div></div></div>
        <div class="clip cap" id="cap-shift-3" data-start="277.588" data-duration="4.570" data-track-index="0"><div class="cap-card soft-raised"><div class="cap-text soft-body"><span class="cap-who">Atlas</span>Heads up: missions show ninety-six percent complete, but most hide a failed check.</div></div></div>

        <div class="clip cap" id="cap-shift-5" data-start="285.252" data-duration="3.298" data-track-index="0"><div class="cap-card soft-raised"><div class="cap-text soft-body"><span class="cap-who">Atlas</span>Done. Nothing left the building.</div></div></div>
