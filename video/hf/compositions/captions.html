        <div class="clip cap" id="cap-intro-0" data-start="3.000" data-duration="5.708" data-track-index="0"><div class="cap-card soft-raised"><div class="cap-text soft-body">This is Atlas. A small box that sits on your desk, with two camera eyes.</div></div></div>
        <div class="clip cap" id="cap-intro-1" data-start="8.608" data-duration="10.244" data-track-index="0"><div class="cap-card soft-raised"><div class="cap-text soft-body">It watches your space, remembers what it saw, answers your questions, and learns new skills. All of it on the box. Your video never leaves.</div></div></div>
        <div class="clip cap" id="cap-intro-2" data-start="18.752" data-duration="11.924" data-track-index="0"><div class="cap-card soft-raised"><div class="cap-text soft-body">Inside are four layers. Cameras that blur every face. A vision model that understands the scene. A memory. And an agent that never acts without asking you.</div></div></div>
        <div class="clip cap" id="cap-day-0" data-start="31.876" data-duration="7.364" data-track-index="0"><div class="cap-card soft-raised"><div class="cap-text soft-body">Point it at your week. Atlas reads your classes and deadlines, and watches how your day really goes at the desk.</div></div></div>
        <div class="clip cap" id="cap-day-1" data-start="39.140" data-duration="6.716" data-track-index="0"><div class="cap-card soft-raised"><div class="cap-text soft-body">Each morning it writes one plan, with its reasons. When something slips, it re-plans.</div></div></div>
        <div class="clip cap" id="cap-day-2" data-start="45.756" data-duration="3.812" data-track-index="0"><div class="cap-card soft-raised"><div class="cap-text soft-body">Nothing is written to your calendar until you tap approve.</div></div></div>
        <div class="clip cap" id="cap-learn-0" data-start="50.768" data-duration="6.932" data-track-index="0"><div class="cap-card soft-raised"><div class="cap-text soft-body">The model on the box is small. That is what makes it private and fast. But small models have gaps.</div></div></div>
        <div class="clip cap" id="cap-learn-1" data-start="57.600" data-duration="9.356" data-track-index="0"><div class="cap-card soft-raised"><div class="cap-text soft-body">Tap teach. A handful of blurred pictures go to the lab, a big open model labels them, and the small one is fine-tuned on the answers.</div></div></div>
        <div class="clip cap" id="cap-learn-2" data-start="66.856" data-duration="9.116" data-track-index="0"><div class="cap-card soft-raised"><div class="cap-text soft-body">A test decides if the new model is really better. Only then does it ship back to the box. Our adapter is public on Hugging Face.</div></div></div>
        <div class="clip cap" id="cap-lab-0" data-start="77.172" data-duration="8.828" data-track-index="0"><div class="cap-card soft-raised"><div class="cap-text soft-body">The lab is two AMD Strix Halo pods. One serves the teacher, a twenty-seven billion parameter Qwen. The other trains.</div></div></div>
        <div class="clip cap" id="cap-lab-1" data-start="85.900" data-duration="9.044" data-track-index="0"><div class="cap-card soft-raised"><div class="cap-text soft-body">Labeling, training, testing and packaging run on ROCm, and every run is recorded with its loss curve and its watts.</div></div></div>
        <div class="clip cap" id="cap-lab-2" data-start="94.844" data-duration="7.484" data-track-index="0"><div class="cap-card soft-raised"><div class="cap-text soft-body">The box and the lab share two files, a dataset out and a model package back. Nothing else crosses.</div></div></div>
        <div class="clip cap" id="cap-swap-0" data-start="103.528" data-duration="8.828" data-track-index="0"><div class="cap-card soft-raised"><div class="cap-text soft-body">The new model arrives as one small package. The box checks it, swaps it in, and rolls back by itself if it does not answer.</div></div></div>
        <div class="clip cap" id="cap-swap-1" data-start="112.256" data-duration="7.196" data-track-index="0"><div class="cap-card soft-raised"><div class="cap-text soft-body">We measure watts on the Jetson, watts on the GPUs, and joules per answer, so you can see what a question costs.</div></div></div>
        <div class="clip cap" id="cap-jetson-0" data-start="120.652" data-duration="9.956" data-track-index="0"><div class="cap-card soft-raised"><div class="cap-text soft-body">Everything live runs on this Jetson. Cameras in, faces blurred, the on-device vision model understanding the scene, answers in seconds.</div></div></div>
        <div class="clip cap" id="cap-jetson-1" data-start="130.508" data-duration="7.316" data-track-index="0"><div class="cap-card soft-raised"><div class="cap-text soft-body">Pull the network cable. It keeps seeing, remembering, alerting and answering. Only learning pauses.</div></div></div>
        <div class="clip cap" id="cap-counts-0" data-start="139.024" data-duration="7.628" data-track-index="0"><div class="cap-card soft-raised"><div class="cap-text soft-body">The same cameras turn a room into data. Frames become events. Events become episodes you can ask about.</div></div></div>
        <div class="clip cap" id="cap-counts-1" data-start="146.552" data-duration="10.196" data-track-index="0"><div class="cap-card soft-raised"><div class="cap-text soft-body">Point it at the bins, and a campus gets a number it can act on. How much was sorted right, before and after a nudge. Tables share counts, never pictures.</div></div></div>
        <div class="clip cap" id="cap-friends-0" data-start="157.948" data-duration="5.012" data-track-index="0"><div class="cap-card soft-raised"><div class="cap-text soft-body">Point it at your friends. Each person's Atlas keeps their own calendar private.</div></div></div>
        <div class="clip cap" id="cap-friends-1" data-start="162.860" data-duration="10.412" data-track-index="0"><div class="cap-card soft-raised"><div class="cap-text soft-body">Ask for a time that works for everyone, and the boxes negotiate. Only free or busy leaves each box. The event lands after a tap.</div></div></div>
        <div class="clip cap" id="cap-dayrun-0" data-start="174.472" data-duration="7.004" data-track-index="0"><div class="cap-card soft-raised"><div class="cap-text soft-body">Point it at your habits. Day Run lets you play tomorrow before you live it, on a map of your own campus.</div></div></div>
        <div class="clip cap" id="cap-dayrun-1" data-start="181.376" data-duration="6.764" data-track-index="0"><div class="cap-card soft-raised"><div class="cap-text soft-body">It is the same box, the same cameras, the same memory. Pointed at one more part of your life.</div></div></div>
