        <div class="clip cap" id="cap-intro-0" data-start="2.500" data-duration="3.404" data-track-index="0"><div class="cap-card soft-raised"><div class="cap-text soft-body">This is Atlas. The personal AI computer.</div></div></div>
        <div class="clip cap" id="cap-intro-1" data-start="5.804" data-duration="8.780" data-track-index="0"><div class="cap-card soft-raised"><div class="cap-text soft-body">It sits on your desk, learns how you live, and works for you. It remembers what matters, answers in plain words, and adapts as your life changes.</div></div></div>
        <div class="clip cap" id="cap-intro-2" data-start="14.484" data-duration="3.644" data-track-index="0"><div class="cap-card soft-raised"><div class="cap-text soft-body">Everything it knows about you stays on the device in front of you.</div></div></div>
        <div class="clip cap" id="cap-intro-3" data-start="18.028" data-duration="8.108" data-track-index="0"><div class="cap-card soft-raised"><div class="cap-text soft-body">Inside, a camera on top, a speaker in front, and a Jetson that runs the vision, the memory, and an agent that acts on your behalf, like a squire.</div></div></div>
        <div class="clip cap" id="cap-day-0" data-start="27.336" data-duration="6.236" data-track-index="0"><div class="cap-card soft-raised"><div class="cap-text soft-body">Point it at your week. Atlas reads your classes and your calendar, and sees how the day really goes at the desk.</div></div></div>
        <div class="clip cap" id="cap-day-1" data-start="33.472" data-duration="9.236" data-track-index="0"><div class="cap-card soft-raised"><div class="cap-text soft-body">Each morning it briefs you. What is first, when to leave, the walk drawn on the map. Fall behind, and it re-plans. One tap puts the new plan on your calendar.</div></div></div>
        <div class="clip cap" id="cap-day-2" data-start="42.608" data-duration="4.868" data-track-index="0"><div class="cap-card soft-raised"><div class="cap-text soft-body">It notices your breaks, asks whether it guessed right, and learns what pulls you away.</div></div></div>
        <div class="clip cap" id="cap-remember-0" data-start="51.836" data-duration="4.868" data-track-index="0"><div class="cap-card soft-raised"><div class="cap-text soft-body">Ask where you left your keys. It answers in seconds, with the frame it saw them in.</div></div></div>
        <div class="clip cap" id="cap-remember-1" data-start="56.604" data-duration="4.268" data-track-index="0"><div class="cap-card soft-raised"><div class="cap-text soft-body">It can just talk, do your arithmetic, or look something up and cite its sources.</div></div></div>
        <div class="clip cap" id="cap-learn-0" data-start="65.336" data-duration="10.148" data-track-index="0"><div class="cap-card soft-raised"><div class="cap-text soft-body">You would expect the model on the box to be small. It is not. A highly capable Qwen runs right here. Fast, accurate, and private. Forty-two demo questions, forty-two right.</div></div></div>
        <div class="clip cap" id="cap-learn-1" data-start="75.384" data-duration="7.340" data-track-index="0"><div class="cap-card soft-raised"><div class="cap-text soft-body">And when your life needs something new, Atlas learns the tool. You describe the task, and the lab teaches it from your own examples.</div></div></div>
        <div class="clip cap" id="cap-lab-0" data-start="85.836" data-duration="7.004" data-track-index="0"><div class="cap-card soft-raised"><div class="cap-text soft-body">The lab is two AMD Strix Halo pods. One is your trainer. It fine-tunes your own model on your own examples.</div></div></div>
        <div class="clip cap" id="cap-lab-1" data-start="92.740" data-duration="7.604" data-track-index="0"><div class="cap-card soft-raised"><div class="cap-text soft-body">The other is the network's trainer. With everyone's consent, it learns from everyone's examples, so every Atlas gets better together.</div></div></div>
        <div class="clip cap" id="cap-lab-2" data-start="100.244" data-duration="7.100" data-track-index="0"><div class="cap-card soft-raised"><div class="cap-text soft-body">A test decides whether the new model is really better. Only then does it ship back. Our adapter is public on Hugging Face.</div></div></div>
        <div class="clip cap" id="cap-device-0" data-start="108.544" data-duration="7.796" data-track-index="0"><div class="cap-card soft-raised"><div class="cap-text soft-body">Everything live runs on the Jetson. A face is blurred the moment a picture would leave the device, so what travels is never a face.</div></div></div>
        <div class="clip cap" id="cap-device-1" data-start="116.240" data-duration="6.260" data-track-index="0"><div class="cap-card soft-raised"><div class="cap-text soft-body">Pull the network cable. It keeps seeing, remembering, alerting and answering. Only learning pauses.</div></div></div>
        <div class="clip cap" id="cap-device-2" data-start="122.400" data-duration="5.588" data-track-index="0"><div class="cap-card soft-raised"><div class="cap-text soft-body">And it keeps a ledger of what left. Tonight, thirteen destinations allowed, thirteen blocked.</div></div></div>
        <div class="clip cap" id="cap-kitchen-0" data-start="129.188" data-duration="7.628" data-track-index="0"><div class="cap-card soft-raised"><div class="cap-text soft-body">Point it at the kitchen. The bin camera sees a can go in the trash, and Atlas knows the rule. At UCF, cans go in recycling.</div></div></div>
        <div class="clip cap" id="cap-kitchen-1" data-start="136.716" data-duration="9.524" data-track-index="0"><div class="cap-card soft-raised"><div class="cap-text soft-body">It keeps the count. Four of six recyclables made it this week, sixty-seven percent against a goal of eighty. A nudge, a game called Sort It, and the number moves.</div></div></div>
        <div class="clip cap" id="cap-kitchen-2" data-start="146.140" data-duration="3.212" data-track-index="0"><div class="cap-card soft-raised"><div class="cap-text soft-body">Only counts leave the box. Never pictures.</div></div></div>
        <div class="clip cap" id="cap-friends-0" data-start="150.552" data-duration="4.148" data-track-index="0"><div class="cap-card soft-raised"><div class="cap-text soft-body">Point it at your friends. Each Atlas keeps its owner's calendar private.</div></div></div>
        <div class="clip cap" id="cap-friends-1" data-start="154.600" data-duration="10.052" data-track-index="0"><div class="cap-card soft-raised"><div class="cap-text soft-body">Ask for a time for everyone, and the boxes talk. Free. Busy then, how about three. Agreed, three of three in. Only free or busy leaves each box.</div></div></div>
        <div class="clip cap" id="cap-lives-0" data-start="166.052" data-duration="8.732" data-track-index="0"><div class="cap-card soft-raised"><div class="cap-text soft-body">Same box, other lives. A night-shift worker. A family home. A plant operator whose robot inspections it reads offline, cited to the row.</div></div></div>
        <div class="clip cap" id="cap-lives-1" data-start="174.684" data-duration="4.700" data-track-index="0"><div class="cap-card soft-raised"><div class="cap-text soft-body">And Day Run. Play tomorrow before you live it, on a map of your own campus.</div></div></div>
        <div class="clip cap" id="cap-end-0" data-start="180.584" data-duration="5.468" data-track-index="0"><div class="cap-card soft-raised"><div class="cap-text soft-body">Atlas. The personal AI computer. It learns you, and keeps you to itself.</div></div></div>
