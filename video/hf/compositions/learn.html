<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <link rel="stylesheet" href="world/soft.css" />
      <style>
        #root { position: absolute; inset: 0; font-family: var(--font); overflow: hidden; }
        #learn-chapter { position: absolute; left: 96px; top: 72px; padding: 14px 28px; font-size: 28px; opacity: 0; }

        /* Line 0: the question the small model gets wrong (right third; the box sits left of centre). */
        #learn-q { position: absolute; left: 1180px; top: 200px; width: 620px; padding: 36px 44px 40px; opacity: 0; }
        #learn-q .ask { font-size: 40px; font-weight: 600; color: var(--ink); line-height: 1.2; }
        #learn-q .who { font-size: 24px; font-weight: 600; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 14px; }
        #learn-ans { position: absolute; left: 1180px; top: 390px; width: 620px; padding: 28px 36px; border-radius: 28px; display: flex; align-items: center; gap: 22px; opacity: 0; }
        #learn-ans .txt { font-size: 36px; font-weight: 500; color: var(--muted); line-height: 1.2; flex: 1; }
        #learn-gap { height: 56px; padding: 0 22px; border-radius: 28px; display: flex; align-items: center; font-size: 26px; font-weight: 700; color: var(--accent); letter-spacing: 0.02em; opacity: 0; }

        /* "Tap teach": a soft key, pressed. */
        #learn-teach { position: absolute; left: 1180px; top: 540px; width: 300px; height: 128px; border-radius: 36px; display: flex; align-items: center; justify-content: center; gap: 20px; font-size: 44px; font-weight: 700; color: var(--ink); opacity: 0; }
        #learn-teach .dot { width: 22px; height: 22px; border-radius: 50%; background: var(--shade); }

        /* Line 1: the two lab steps, top centre between the box (left) and the lab (right). */
        #learn-chips { position: absolute; left: 0; right: 0; top: 150px; display: flex; justify-content: center; gap: 32px; }
        .learn-chip { height: 96px; padding: 0 44px 0 36px; border-radius: 48px; display: flex; align-items: center; gap: 20px; font-size: 36px; font-weight: 600; color: var(--ink); opacity: 0; }
        .learn-chip .dot { width: 18px; height: 18px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 6px rgba(217,119,74,0.16); }
        .learn-chip .n { font-size: 26px; font-weight: 700; color: var(--muted); }

        /* Line 2: the test gate, top centre. */
        #learn-gate { position: absolute; left: 50%; top: 130px; width: 760px; margin-left: -380px; padding: 30px 48px 34px; display: flex; align-items: center; gap: 36px; opacity: 0; }
        #learn-gate .lbl { font-size: 26px; font-weight: 600; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
        #learn-gate .nums { display: flex; align-items: baseline; gap: 20px; font-variant-numeric: tabular-nums; }
        #learn-gate .old { font-size: 56px; font-weight: 600; color: var(--muted); }
        #learn-gate .arrow { font-size: 40px; color: var(--shade); }
        #learn-gate .new { font-size: 64px; font-weight: 700; color: var(--ink); min-width: 150px; }
        #learn-check { width: 88px; height: 88px; border-radius: 50%; display: grid; place-items: center; margin-left: auto; opacity: 0; }
        #learn-check svg { width: 44px; height: 44px; }
        #learn-check path { fill: none; stroke: var(--accent); stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
        #learn-gate .ex { position: absolute; right: 36px; bottom: -22px; height: 44px; padding: 0 18px; border-radius: 22px; display: flex; align-items: center; font-size: 22px; font-weight: 600; color: var(--muted); }

        /* The adapter card. */
        #learn-hf { position: absolute; left: 50%; top: 130px; width: 860px; margin-left: -430px; padding: 34px 52px 38px; opacity: 0; }
        #learn-hf .big { font-size: 48px; font-weight: 700; color: var(--ink); line-height: 1.15; letter-spacing: -0.01em; }
        #learn-hf .big b { color: var(--accent); font-weight: 700; }
        #learn-hf .sub { margin-top: 10px; font-size: 26px; font-weight: 500; color: var(--muted); }
      </style>
      <div id="root" data-composition-id="learn" data-width="1920" data-height="1080">
        <div id="learn-chapter" class="soft-raised soft-muted">It learns</div>

        <div id="learn-q" class="soft-raised"><div class="who">You ask</div><div class="ask">What is on the desk?</div></div>
        <div id="learn-ans" class="soft-well"><div class="txt">a dark rectangular object</div><div id="learn-gap" class="soft-pressed">gap</div></div>
        <div id="learn-teach" class="soft-raised"><div class="dot"></div>Teach</div>

        <div id="learn-chips">
          <div class="learn-chip soft-raised" id="learn-chip-label"><div class="dot"></div><span class="n">1</span>label</div>
          <div class="learn-chip soft-raised" id="learn-chip-tune"><div class="dot"></div><span class="n">2</span>fine-tune</div>
        </div>

        <div id="learn-gate" class="soft-raised">
          <div class="lbl">better?</div>
          <div class="nums"><div class="old">0.71</div><div class="arrow">&rarr;</div><div class="new" id="learn-gate-new">0.71</div></div>
          <div id="learn-check" class="soft-raised"><svg viewBox="0 0 48 48"><path id="learn-check-path" d="M10 25 L20 35 L38 14"/></svg></div>
          <div class="ex soft-pressed">example</div>
        </div>

        <div id="learn-hf" class="soft-raised"><div class="big">Adapter public on <b>Hugging Face</b></div><div class="sub">the fine-tuned adapter, open weights</div></div>
      </div>
      <script>
        (function () {
          // Timing comes from film.json: the host (index.html) carries each spoken line as <audio id="voice-learn-i" data-start>
          // and the scene start on #host-learn. Read them, so nothing here hard-codes seconds; the fallback below is only
          // for previewing this file alone (copied from film.json).
          const FALLBACK = [{ start: 0, duration: 6.432 }, { start: 6.832, duration: 8.856 }, { start: 16.088, duration: 8.616 }];
          function lines() {
            const host = document.getElementById("host-learn"); if (!host) return FALLBACK;
            const s0 = parseFloat(host.dataset.start), out = [];
            for (let i = 0; ; i++) { const a = document.getElementById("voice-learn-" + i); if (!a) break; out.push({ start: parseFloat(a.dataset.start) - s0, duration: parseFloat(a.dataset.duration) }); }
            return out.length === FALLBACK.length ? out : FALLBACK;
          }
          const LN = lines();
          const L = (i, f) => LN[i].start + f * LN[i].duration;
          const RAISED = "18px 18px 36px #b7c0cd, -18px -18px 36px #ffffff";
          const PRESSED = "inset 10px 10px 20px #b7c0cd, inset -10px -10px 20px #ffffff";
          const tl = gsap.timeline({ paused: true });

          tl.fromTo("#learn-chapter", { opacity: 0, y: -12 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.2);

          // Line 0: "The model on the box is small": the question; "private and fast": its answer, muted; "gaps": the tag.
          tl.fromTo("#learn-q", { opacity: 0, y: 28, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.8, ease: "power3.out" }, L(0, 0.12));
          tl.fromTo("#learn-ans", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, L(0, 0.4));
          tl.fromTo("#learn-gap", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power4.out" }, L(0, 0.8));

          // Line 1: "Tap teach": the key arrives just ahead of the word and is pressed on it.
          tl.fromTo("#learn-teach", { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.6, ease: "power4.out" }, L(1, 0.0) - 0.5);
          tl.fromTo("#learn-teach", { boxShadow: RAISED, scale: 1 }, { boxShadow: PRESSED, scale: 0.97, duration: 0.3, ease: "power2.in" }, L(1, 0.04));
          tl.to("#learn-teach .dot", { backgroundColor: "#d9774a", boxShadow: "0 0 0 6px rgba(217,119,74,0.18)", duration: 0.3, ease: "power2.out" }, L(1, 0.04));
          tl.to("#learn-teach", { color: "#d9774a", duration: 0.3, ease: "power2.out" }, L(1, 0.04));
          // The pictures leave; the question, answer and key clear as the camera pans to the lab.
          tl.to("#learn-ans", { opacity: 0, y: 10, duration: 0.5, ease: "power2.in" }, L(1, 0.2));
          tl.to("#learn-q", { opacity: 0, y: 10, duration: 0.5, ease: "power2.in" }, L(1, 0.24));
          tl.to("#learn-teach", { opacity: 0, y: 10, duration: 0.5, ease: "power2.in" }, L(1, 0.28));
          // "a big open model labels them" / "fine-tuned on the answers": the two steps light in turn.
          tl.fromTo("#learn-chip-label", { opacity: 0, y: 30, scale: 0.92 }, { opacity: 1, y: 0, scale: 1, duration: 0.7, ease: "power4.out" }, L(1, 0.44));
          tl.fromTo("#learn-chip-tune", { opacity: 0, y: 30, scale: 0.92 }, { opacity: 1, y: 0, scale: 1, duration: 0.7, ease: "power4.out" }, L(1, 0.72));
          tl.to(".learn-chip", { opacity: 0, y: -14, duration: 0.5, ease: "power2.in", stagger: 0.06 }, L(2, 0.0));

          // Line 2: "A test decides if the new model is really better": the gate counts up, then the check lands.
          tl.fromTo("#learn-gate", { opacity: 0, y: 28, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.8, ease: "power3.out" }, L(2, 0.06));
          const score = { v: 0.71 }, newEl = document.getElementById("learn-gate-new");
          tl.to(score, { v: 0.84, duration: 1.4, ease: "power3.out", onUpdate: () => { newEl.textContent = score.v.toFixed(2); } }, L(2, 0.16));
          const check = document.getElementById("learn-check-path"), len = check.getTotalLength();
          tl.fromTo("#learn-check", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power4.out" }, L(2, 0.33));
          tl.fromTo(check, { strokeDasharray: len, strokeDashoffset: len }, { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" }, L(2, 0.36));
          // "Only then does it ship back to the box": the gate clears while the package travels.
          tl.to("#learn-gate", { opacity: 0, y: -16, duration: 0.6, ease: "power2.in" }, L(2, 0.58));
          // "Our adapter is public on Hugging Face."
          tl.fromTo("#learn-hf", { opacity: 0, y: 28, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.8, ease: "power3.out" }, L(2, 0.66));
          tl.to("#learn-hf", { opacity: 0, y: -12, duration: 0.6, ease: "power2.in" }, L(2, 1.0) + 0.3);
          tl.to("#learn-chapter", { opacity: 0, duration: 0.5, ease: "power2.in" }, L(2, 1.0) + 0.5);

          window.__timelines["learn"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
