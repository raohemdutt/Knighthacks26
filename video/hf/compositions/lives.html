<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <link rel="stylesheet" href="world/soft.css" />
      <style>
        #root { position: absolute; inset: 0; font-family: var(--font); overflow: hidden; }
        #lives-chapter { position: absolute; left: 96px; top: 72px; padding: 14px 28px; font-size: 28px; opacity: 0; }

        /* Line 0: three other lives, one card each, across the top of the campus shot. */
        #lives-row { position: absolute; left: 96px; right: 96px; top: 160px; display: flex; gap: 40px; }
        .lives-card { flex: 1; padding: 30px 36px 34px; border-radius: 36px; opacity: 0; }
        .lives-card .k { display: flex; align-items: center; gap: 12px; font-size: 28px; font-weight: 600; color: var(--muted); }
        .lives-card .k i { width: 14px; height: 14px; border-radius: 50%; background: var(--accent); }
        .lives-card .v { margin-top: 8px; font-size: 40px; font-weight: 700; color: var(--ink); line-height: 1.15; letter-spacing: -0.005em; }
        .lives-card .rows { margin-top: 18px; display: flex; flex-direction: column; gap: 12px; }
        .lives-card .r { padding: 12px 20px; border-radius: 18px; font-size: 28px; font-weight: 500; color: var(--ink); display: flex; justify-content: space-between; gap: 16px; white-space: nowrap; }
        .lives-card .r span { color: var(--muted); }
        .lives-card .cite { margin-top: 14px; font-size: 28px; font-weight: 600; color: var(--accent); opacity: 0; }

        /* Line 1: Day Run. */
        #lives-dayrun { position: absolute; left: 50%; top: 170px; padding: 28px 52px 32px; border-radius: 40px; text-align: center; opacity: 0; }
        #lives-dayrun .k { font-size: 28px; font-weight: 600; color: var(--muted); }
        #lives-dayrun .v { margin-top: 4px; font-size: 64px; font-weight: 700; color: var(--ink); line-height: 1.1; letter-spacing: -0.01em; white-space: nowrap; }
        #lives-dayrun .v b { color: #456cb3; }
      </style>
      <div id="root" data-composition-id="lives" data-width="1920" data-height="1080">
        <div id="lives-chapter" class="soft-raised soft-muted">Same box, other lives</div>

        <div id="lives-row">
          <div id="lives-card-0" class="lives-card soft-raised">
            <div class="k"><i></i>Night shift</div>
            <div class="v">The day starts in the afternoon</div>
            <div class="rows">
              <div class="r soft-well">Shift <span>10 PM – 6 AM</span></div>
              <div class="r soft-well">Sleep <span>7:30 AM – 2:30 PM</span></div>
            </div>
          </div>
          <div id="lives-card-1" class="lives-card soft-raised">
            <div class="k"><i></i>Family home</div>
            <div class="v">Each person, their own habits</div>
            <div class="rows">
              <div class="r soft-well">Homework <span>at the table</span></div>
              <div class="r soft-well">Chores <span>shared</span></div>
            </div>
          </div>
          <div id="lives-card-2" class="lives-card soft-raised">
            <div class="k"><i></i>Plant operator · offline</div>
            <div class="v">Check first: HX-202</div>
            <div class="rows">
              <div class="r soft-well">Re-inspect <span>don't dispatch yet</span></div>
              <div class="r soft-well">Acoustic <span>13 of 43 failed</span></div>
            </div>
            <div class="cite">Cited to the row</div>
          </div>
        </div>

        <div id="lives-dayrun" class="soft-raised"><div class="k">Day Run</div><div class="v">Play <b>tomorrow</b> today</div></div>
      </div>
      <script>
        (function () {
          // Timing comes from film.json through the host (<audio id="voice-lives-i" data-start>, #host-lives data-start);
          // the fallback (film.json, local seconds) is only for previewing this file alone. Word moments by character
          // fraction: "night-shift" 0.18, "family home" 0.34, "plant operator" 0.45, "cited to the row" 0.88; "Day Run" 0.1.
          // Card facts: config/profiles/shift-worker/profile.yaml (shift 22:00-06:00, sleep 07:30-14:30),
          // config/profiles/family-home/profile.yaml, docs/spot.md (HX-202 triage; acoustic 13 of 43 failed).
          const FALLBACK = [{ start: 0, duration: 8.232 }, { start: 8.632, duration: 4.2 }];
          function lines() {
            const host = document.getElementById("host-lives"); if (!host) return FALLBACK;
            const s0 = parseFloat(host.dataset.start), out = [];
            for (let i = 0; ; i++) { const a = document.getElementById("voice-lives-" + i); if (!a) break; out.push({ start: parseFloat(a.dataset.start) - s0, duration: parseFloat(a.dataset.duration) }); }
            return out.length === FALLBACK.length ? out : FALLBACK;
          }
          const LN = lines();
          const F = (i, f) => LN[i].start + f * LN[i].duration;
          const tl = gsap.timeline({ paused: true });
          tl.fromTo("#lives-chapter", { opacity: 0, y: -12 }, { opacity: 1, y: 0, duration: 0.6, ease: "power4.out" }, 0.2);

          [0.17, 0.33, 0.45].forEach((f, i) => {
            tl.fromTo("#lives-card-" + i, { opacity: 0, y: 36, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.7, ease: "power4.out" }, F(0, f));
          });
          tl.fromTo("#lives-card-2 .cite", { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.5, ease: "power4.out" }, F(0, 0.87));
          tl.to(".lives-card", { opacity: 0, y: -16, duration: 0.45, ease: "power2.in", stagger: 0.06 }, LN[1].start - 0.2);

          tl.fromTo("#lives-dayrun", { opacity: 0, y: 24, xPercent: -50 }, { opacity: 1, y: 0, xPercent: -50, duration: 0.6, ease: "power4.out" }, F(1, 0.08));
          tl.to("#lives-dayrun", { opacity: 0, y: -12, duration: 0.45, ease: "power2.in" }, F(1, 0.6));
          tl.to("#lives-chapter", { opacity: 0, duration: 0.4, ease: "power2.in" }, F(1, 0.6));
          window.__timelines["lives"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
