<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <link rel="stylesheet" href="world/soft.css" />
      <style>
        #root { position: absolute; inset: 0; font-family: var(--font); overflow: hidden; }
        #day-chapter { position: absolute; left: 96px; top: 72px; padding: 14px 28px; font-size: 28px; opacity: 0; }

        /* The week strip: a soft card at the right, five day chips, three class blocks and one deadline. */
        #day-week-float { position: absolute; left: 1264px; top: 150px; width: 560px; }
        #day-week { position: relative; width: 560px; padding: 30px 36px 34px; opacity: 0; }
        .day-week-head { display: flex; justify-content: space-between; align-items: baseline; }
        .day-days { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; margin-top: 22px; }
        .day-day { height: 60px; display: grid; place-items: center; font-size: 28px; font-weight: 600; border-radius: 20px; opacity: 0; }
        .day-grid { position: relative; height: 300px; margin-top: 18px; border-radius: 24px; }
        .day-col { position: absolute; top: 14px; bottom: 14px; width: 2px; background: var(--shade); opacity: 0.35; }
        .day-block { position: absolute; width: 86px; border-radius: 18px; padding: 10px 0 0; text-align: center; font-size: 26px; font-weight: 600; color: var(--ink); opacity: 0;
          box-shadow: 8px 8px 16px var(--shade), -8px -8px 16px var(--light); background: var(--surface); }
        .day-block small { display: block; font-size: 22px; font-weight: 500; color: var(--muted); margin-top: 2px; }
        .day-due { position: absolute; width: 86px; height: 56px; border-radius: 18px; display: grid; place-items: center; font-size: 24px; font-weight: 700; color: #fff; background: var(--accent); opacity: 0;
          box-shadow: 8px 8px 16px var(--shade), -6px -6px 14px var(--light); }
        #day-dot { position: absolute; width: 26px; height: 26px; border-radius: 50%; background: var(--accent); opacity: 0; box-shadow: 0 0 0 8px rgba(217,119,74,0.18); }

        /* The plan card: three rows with their reasons; the time column stays put when rows move. */
        #day-plan-float { position: absolute; left: 96px; top: 170px; width: 640px; }
        #day-plan { position: relative; width: 640px; padding: 30px 36px 36px; opacity: 0; }
        .day-plan-head { display: flex; justify-content: space-between; align-items: baseline; }
        .day-rows { position: relative; height: 312px; margin-top: 22px; }
        .day-time { position: absolute; left: 0; width: 86px; height: 92px; display: grid; place-items: center; font-size: 26px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; opacity: 0; }
        .day-row { position: absolute; left: 100px; right: 0; height: 92px; padding: 13px 22px; border-radius: 22px; opacity: 0; display: flex; align-items: center; justify-content: space-between; }
        .day-row-text { min-width: 0; }
        .day-row-title { font-size: 32px; font-weight: 600; color: var(--ink); line-height: 1.15; white-space: nowrap; }
        .day-row-why { font-size: 24px; font-weight: 500; color: var(--muted); line-height: 1.2; white-space: nowrap; }
        .day-tag { flex: none; padding: 6px 14px; border-radius: 14px; font-size: 22px; font-weight: 600; color: var(--muted); background: var(--surface); box-shadow: 6px 6px 12px var(--shade), -6px -6px 12px var(--light); opacity: 0; }

        /* The Approve button: raised at rest, pressed after the tap. */
        #day-approve-float { position: absolute; left: 96px; top: 690px; width: 420px; }
        #day-approve { position: relative; width: 420px; height: 112px; border-radius: 32px; opacity: 0; }
        #day-approve-raised, #day-approve-pressed { position: absolute; inset: 0; border-radius: 32px; }
        #day-approve-pressed { opacity: 0; }
        .day-approve-face { position: absolute; inset: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 30px 0 36px; }
        .day-approve-label { font-size: 40px; font-weight: 700; color: var(--ink); }
        #day-check { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; }
        #day-check svg { width: 56px; height: 56px; display: block; }
        #day-check-ring { fill: none; stroke: var(--shade); stroke-width: 3; }
        #day-check-fill { fill: var(--accent); opacity: 0; }
        #day-check-mark { fill: none; stroke: #fff; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      </style>
      <div id="root" data-composition-id="day" data-width="1920" data-height="1080">
        <div id="day-chapter" class="soft-raised soft-muted">It runs your day</div>

        <div id="day-week-float">
          <div id="day-week" class="soft-raised">
            <div class="day-week-head"><div class="soft-body" style="font-weight:600">This week</div><div class="soft-small">from Canvas</div></div>
            <div class="day-days">
              <div class="day-day soft-well soft-muted" id="day-d0">Mon</div>
              <div class="day-day soft-well soft-muted" id="day-d1">Tue</div>
              <div class="day-day soft-well soft-muted" id="day-d2">Wed</div>
              <div class="day-day soft-well soft-muted" id="day-d3">Thu</div>
              <div class="day-day soft-well soft-muted" id="day-d4">Fri</div>
            </div>
            <div class="day-grid soft-well">
              <div class="day-col" style="left:99px"></div><div class="day-col" style="left:200px"></div><div class="day-col" style="left:300px"></div><div class="day-col" style="left:401px"></div>
              <div class="day-block" id="day-b0" style="left:0px; top:22px; height:96px">Algo<small>9:00</small></div>
              <div class="day-block" id="day-b1" style="left:201px; top:118px; height:96px">Calc<small>13:00</small></div>
              <div class="day-block" id="day-b2" style="left:301px; top:40px; height:96px">Phys<small>10:30</small></div>
              <div class="day-due" id="day-due" style="left:402px; top:214px">Due</div>
              <div id="day-dot" style="left:130px; top:182px"></div>
            </div>
          </div>
        </div>

        <div id="day-plan-float">
          <div id="day-plan" class="soft-raised">
            <div class="day-plan-head"><div class="soft-body" style="font-weight:600">Today's plan</div><div class="soft-small">7:02 AM</div></div>
            <div class="soft-small" style="margin-top:4px">One plan, with its reasons</div>
            <div class="day-rows">
              <div class="day-time" id="day-t0" style="top:0px">9:00</div>
              <div class="day-time" id="day-t1" style="top:104px">13:00</div>
              <div class="day-time" id="day-t2" style="top:208px">16:30</div>
              <div class="day-row soft-well" id="day-r0" style="top:0px">
                <div class="day-row-text"><div class="day-row-title">Algorithms lecture</div><div class="day-row-why">on your calendar</div></div>
              </div>
              <div class="day-row soft-well" id="day-r1" style="top:104px">
                <div class="day-row-text"><div class="day-row-title">Project deep work</div><div class="day-row-why">due Friday, 2 h left</div></div>
                <div class="day-tag" id="day-tag-slip">slipped</div>
              </div>
              <div class="day-row soft-well" id="day-r2" style="top:208px">
                <div class="day-row-text"><div class="day-row-title">Gym</div><div class="day-row-why">you usually go at four</div></div>
              </div>
            </div>
          </div>
        </div>

        <div id="day-approve-float">
          <div id="day-approve">
            <div id="day-approve-raised" class="soft-raised"></div>
            <div id="day-approve-pressed" class="soft-pressed"></div>
            <div class="day-approve-face">
              <div class="day-approve-label">Approve</div>
              <div id="day-check"><svg viewBox="0 0 56 56"><circle id="day-check-ring" cx="28" cy="28" r="24"/><circle id="day-check-fill" cx="28" cy="28" r="24"/><path id="day-check-mark" d="M 17 29 L 25 37 L 40 20"/></svg></div>
            </div>
          </div>
        </div>
      </div>
      <script>
        (function () {
          // Local time: 0 = scene start. Line starts come from film.json ("day"): absolute 31.876 / 39.14 / 45.756,
          // durations 6.864 / 6.216 / 3.312; the scene lasts 18.392 s.
          const L0 = 0, D0 = 6.864, L1 = 39.14 - 31.876, D1 = 6.216, L2 = 45.756 - 31.876, D2 = 3.312, END = 18.392;
          const tl = gsap.timeline({ paused: true });
          const F = 1 / 30;

          tl.fromTo("#day-chapter", { opacity: 0, y: -12 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.2);

          // Ambient: the two big cards breathe on their own slow sine, out of phase.
          const breathe = (sel, amp, period, from) => {
            const n = Math.max(0, Math.floor((END - from) / period) - 1);
            tl.fromTo(sel, { y: 0 }, { y: -amp, duration: period / 2, ease: "sine.inOut", yoyo: true, repeat: 2 * n + 1 }, from);
          };
          breathe("#day-week-float", 6, 3.6, 0.0);
          breathe("#day-plan-float", 5, 4.4, 0.0);

          // ---- Line 0: "Point it at your week": the week strip arrives; day chips whip in (waterfall); classes, then the deadline. ----
          tl.fromTo("#day-week", { opacity: 0, y: 36, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.7, ease: "power3.out" }, L0 + 0.55);
          let t = L0 + 0.95;
          for (let i = 0; i < 5; i++) {
            const dur = 0.17 - i * 0.01;
            tl.set("#day-d" + i, { opacity: 1, y: 54 - i * 4 }, t);
            tl.to("#day-d" + i, { y: 0, duration: dur, ease: "power4.out" }, t);
            t += dur - F;
          }
          // "reads your classes": three blocks whip up into the grid.
          t = L0 + 0.3 * D0;
          for (let i = 0; i < 3; i++) {
            tl.set("#day-b" + i, { opacity: 1, y: 70 }, t);
            tl.to("#day-b" + i, { y: 0, duration: 0.2, ease: "power4.out" }, t);
            t += 0.17;
          }
          // "and deadlines": the one orange thing in the strip.
          tl.fromTo("#day-due", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" }, L0 + 0.5 * D0);

          // ---- Line 1: "Each morning it writes one plan, with its reasons": the plan card writes in, row by row. ----
          tl.fromTo("#day-plan", { opacity: 0, y: 36, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.7, ease: "power3.out" }, L1 + 0.35);
          for (let i = 0; i < 3; i++) {
            const when = L1 + 0.9 + i * 0.5;
            tl.fromTo("#day-t" + i, { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, when);
            tl.fromTo("#day-r" + i, { opacity: 0, x: -28 }, { opacity: 1, x: 0, duration: 0.55, ease: "power3.out" }, when);
            tl.fromTo("#day-r" + i + " .day-row-text", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.7, ease: "power2.out" }, when + 0.1);
          }
          // "When something slips": the deep-work row gets a tag.
          tl.fromTo("#day-tag-slip", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" }, L1 + 0.6 * D1);
          // "it re-plans": press, release, and the row slides to the later slot while the gym slides up (times stay put).
          const RP = L1 + 0.8 * D1, PRESS = 0.12;
          tl.to("#day-r1", { scale: 0.965, duration: PRESS, ease: "power1.in" }, RP);
          tl.to("#day-r1", { scale: 1, duration: 0.6, ease: "back.out(1.6)" }, RP + PRESS);
          tl.to("#day-r1", { y: 104, duration: 0.75, ease: "power3.inOut" }, RP + PRESS);
          tl.to("#day-r2", { y: -104, duration: 0.75, ease: "power3.inOut" }, RP + PRESS + 0.05);
          tl.to("#day-tag-slip", { opacity: 0, duration: 0.3, ease: "power2.in" }, RP + PRESS);

          // ---- Line 2: "Nothing is written to your calendar until you tap approve". ----
          tl.fromTo("#day-approve", { opacity: 0, y: 40, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: "power3.out" }, L2 + 0.25);
          const TAP = L2 + 0.7 * D2;
          tl.to("#day-approve", { scale: 0.95, duration: PRESS, ease: "power1.in" }, TAP);
          tl.to("#day-approve-pressed", { opacity: 1, duration: PRESS, ease: "power1.in" }, TAP);
          tl.to("#day-approve-raised", { opacity: 0, duration: PRESS, ease: "power1.in" }, TAP);
          tl.to("#day-approve", { scale: 0.985, duration: 0.6, ease: "back.out(1.4)" }, TAP + PRESS);
          tl.fromTo("#day-check-fill", { opacity: 0, scale: 0.4, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.4, ease: "power3.out" }, TAP + PRESS);
          const mark = document.getElementById("day-check-mark"), ml = mark.getTotalLength();
          mark.style.strokeDasharray = ml; mark.style.strokeDashoffset = ml;
          tl.to(mark, { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" }, TAP + PRESS + 0.15);
          // One orange dot lands in the week strip: the only write to the calendar, after the tap.
          tl.fromTo("#day-dot", { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" }, TAP + 0.75);

          // ---- Out: everything lifts away before the hand-over. ----
          tl.to(["#day-plan", "#day-approve"], { opacity: 0, y: -18, duration: 0.5, ease: "power2.in", stagger: 0.06 }, END - 0.95);
          tl.to("#day-week", { opacity: 0, y: -18, duration: 0.5, ease: "power2.in" }, END - 0.85);
          tl.to("#day-chapter", { opacity: 0, duration: 0.4, ease: "power2.in" }, END - 0.6);

          window.__timelines["day"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
