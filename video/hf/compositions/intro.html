<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <link rel="stylesheet" href="world/soft.css" />
      <style>
        #root { position: absolute; inset: 0; font-family: var(--font); overflow: hidden; }
        #intro-chapter { position: absolute; left: 96px; top: 72px; padding: 14px 28px; font-size: 28px; opacity: 0; }
        /* The wordmark: one soft-raised card high in the frame while the parts fall in beneath it. */
        #intro-mark { position: absolute; left: 50%; top: 120px; padding: 18px 92px 28px; font-size: 144px; opacity: 0; will-change: transform, opacity; }
        #intro-tag { position: absolute; left: 0; right: 0; top: 340px; text-align: center; font-size: 40px; font-weight: 500; opacity: 0; }
        /* Line 1: three soft words in the right column, one after another. */
        #intro-words { position: absolute; right: 120px; top: 300px; display: flex; flex-direction: column; align-items: flex-end; gap: 30px; }
        .intro-word { padding: 22px 44px 24px 36px; border-radius: 40px; display: flex; align-items: center; gap: 22px; font-size: 64px; font-weight: 600; letter-spacing: -0.01em; color: var(--ink); opacity: 0; }
        .intro-word i { width: 18px; height: 18px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 7px rgba(217,119,74,0.14); flex: none; }
        /* Line 3: the Jetson's three jobs, and the squire card. */
        #intro-jobs { position: absolute; right: 120px; top: 230px; display: flex; flex-direction: column; align-items: flex-end; gap: 24px; }
        .intro-chip { height: 92px; padding: 0 40px 0 30px; border-radius: 46px; display: flex; align-items: center; gap: 18px; font-size: 40px; font-weight: 600; color: var(--ink); opacity: 0; }
        .intro-chip i { width: 16px; height: 16px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 6px rgba(217,119,74,0.14); }
        #intro-squire { position: absolute; right: 120px; top: 640px; width: 460px; padding: 30px 38px; border-radius: 32px; opacity: 0; }
        #intro-squire .k { font-size: 28px; font-weight: 600; color: var(--accent); letter-spacing: 0.02em; }
        #intro-squire .v { margin-top: 6px; font-size: 40px; font-weight: 600; color: var(--ink); line-height: 1.2; }
      </style>
      <div id="root" data-composition-id="intro" data-width="1920" data-height="1080">
        <div id="intro-mark" class="soft-raised soft-title">Atlas</div>
        <div id="intro-tag" class="soft-muted">The personal AI computer</div>
        <div id="intro-chapter" class="soft-raised soft-muted">Atlas</div>
        <div id="intro-words">
          <div id="intro-word-0" class="intro-word soft-raised"><i></i>Learns you</div>
          <div id="intro-word-1" class="intro-word soft-raised"><i></i>Remembers</div>
          <div id="intro-word-2" class="intro-word soft-raised"><i></i>Adapts</div>
        </div>
        <div id="intro-jobs">
          <div id="intro-chip-0" class="intro-chip soft-raised"><i></i>Vision</div>
          <div id="intro-chip-1" class="intro-chip soft-raised"><i></i>Memory</div>
          <div id="intro-chip-2" class="intro-chip soft-raised"><i></i>Agent</div>
        </div>
        <div id="intro-squire" class="soft-raised"><div class="k">Like a squire</div><div class="v">Acts on your behalf</div></div>
      </div>
      <script>
        (function () {
          // LOCAL time (the intro starts at 0). Word times come from film.json: line 1 starts 5.804 (8.280 long), line 3
          // starts 18.028 (7.608 long); a word's time = line.start + (char offset / line length) * line.duration.
          // learns 7.06, remembers 9.52, adapts 12.49; vision 21.81, memory 22.44, agent 23.22, acts ~23.9, squire 25.27.
          // Re-derive these if the words in film.yaml change. The scene lasts 26.836.
          const DUR = 26.836, FIRST = 2.5;
          const tl = gsap.timeline({ paused: true });
          const PRESSED = "inset 8px 8px 16px #b7c0cd, inset -8px -8px 16px #ffffff";

          // The wordmark arrives while the parts fall, and leaves on the first word.
          tl.fromTo("#intro-mark", { opacity: 0, scale: 0.94, y: 20, xPercent: -50 }, { opacity: 1, scale: 1, y: 0, xPercent: -50, duration: 1.1, ease: "power4.out" }, 0.2);
          tl.fromTo("#intro-tag", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.8, ease: "power4.out" }, 0.8);
          tl.to("#intro-tag", { opacity: 0, y: -8, duration: 0.4, ease: "power2.in" }, FIRST + 0.45);
          tl.to("#intro-mark", { opacity: 0, scale: 0.97, y: -16, xPercent: -50, duration: 0.45, ease: "power2.in" }, FIRST + 0.55);
          tl.fromTo("#intro-chapter", { opacity: 0, y: -12 }, { opacity: 1, y: 0, duration: 0.6, ease: "power4.out" }, FIRST + 1.1);

          // Line 1: each word lands as it is spoken; the earlier ones press in and go quiet.
          const words = [7.06, 9.52, 12.49];
          words.forEach((w, i) => {
            tl.fromTo("#intro-word-" + i, { opacity: 0, y: 26, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.7, ease: "power4.out" }, w - 0.1);
            if (i < 2) {
              tl.to("#intro-word-" + i, { boxShadow: PRESSED, color: "#6f7886", duration: 0.5, ease: "power2.inOut" }, words[i + 1] - 0.1);
              tl.to("#intro-word-" + i + " i", { backgroundColor: "#b7c0cd", boxShadow: "0 0 0 0px rgba(217,119,74,0)", duration: 0.5 }, words[i + 1] - 0.1);
            }
          });
          tl.to(".intro-word", { opacity: 0, x: 24, duration: 0.45, ease: "power2.in", stagger: 0.06 }, 14.2);

          // Line 3: the Jetson's jobs in the right column, then the squire card.
          [21.81, 22.44, 23.22].forEach((w, i) => {
            tl.fromTo("#intro-chip-" + i, { opacity: 0, x: 30, scale: 0.92 }, { opacity: 1, x: 0, scale: 1, duration: 0.6, ease: "power4.out" }, w - 0.05);
          });
          tl.fromTo("#intro-squire", { opacity: 0, y: 26, scale: 0.95 }, { opacity: 1, y: 0, scale: 1, duration: 0.7, ease: "power4.out" }, 23.85);
          tl.to(".intro-chip", { opacity: 0, x: 24, duration: 0.4, ease: "power2.in", stagger: 0.05 }, 25.3);
          tl.to("#intro-squire", { opacity: 0, y: 14, duration: 0.45, ease: "power2.in" }, 25.45);
          tl.to("#intro-chapter", { opacity: 0, duration: 0.4, ease: "power2.in" }, DUR - 0.5);
          window.__timelines["intro"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
