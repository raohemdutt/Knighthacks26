<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <link rel="stylesheet" href="world/soft.css" />
      <style>
        #root { position: absolute; inset: 0; font-family: var(--font); }
        #end-mark { position: absolute; left: 50%; top: 132px; padding: 22px 84px 30px; opacity: 0; will-change: transform, opacity; }
        #end-tag { position: absolute; left: 0; right: 0; top: 352px; text-align: center; font-size: 40px; font-weight: 500; letter-spacing: 0.01em; opacity: 0; }
      </style>
      <div id="root" data-composition-id="end" data-width="1920" data-height="1080">
        <div id="end-mark" class="soft-raised soft-title">Atlas</div>
        <div id="end-tag" class="soft-muted">Knight Hacks 2026</div>
      </div>
      <script>
        (function () {
          // The last five seconds: the wordmark returns and holds. No exit: the film ends on this frame.
          const tl = gsap.timeline({ paused: true });
          tl.fromTo("#end-mark", { opacity: 0, scale: 0.94, y: 18, xPercent: -50 }, { opacity: 1, scale: 1, y: 0, xPercent: -50, duration: 1.3, ease: "power3.out", transformOrigin: "50% 50%" }, 0.5);
          tl.fromTo("#end-tag", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 1.0, ease: "power3.out" }, 1.2);
          window.__timelines["end"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
