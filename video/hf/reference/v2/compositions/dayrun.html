<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <link rel="stylesheet" href="world/soft.css" />
      <style>
        #root { position: absolute; inset: 0; font-family: var(--font); overflow: hidden; }
        #dayrun-chapter { position: absolute; left: 96px; top: 72px; padding: 14px 28px; font-size: 28px; opacity: 0; }

        /* Day Run: a small chip and three stars, at the top right over the campus. */
        #dayrun-card-float { position: absolute; left: 1330px; top: 150px; width: 494px; }
        #dayrun-card { position: relative; width: 494px; padding: 28px 36px 34px; opacity: 0; }
        .dayrun-head { display: flex; align-items: center; justify-content: space-between; }
        #dayrun-chip { display: inline-flex; align-items: center; gap: 12px; padding: 10px 22px 10px 16px; border-radius: 20px; font-size: 28px; font-weight: 700; color: var(--ink); }
        #dayrun-chip svg { width: 26px; height: 26px; display: block; }
        .dayrun-play { fill: var(--accent); }
        .dayrun-stars { display: flex; justify-content: space-between; margin-top: 26px; padding: 0 6px; }
        .dayrun-star { width: 116px; height: 116px; border-radius: 50%; display: grid; place-items: center; opacity: 0; }
        .dayrun-star svg { width: 62px; height: 62px; display: block; }
        .dayrun-star path { fill: var(--accent); }
        .dayrun-foot { margin-top: 24px; display: flex; justify-content: space-between; align-items: center; gap: 18px; }
        .dayrun-foot .soft-small { max-width: 300px; }
        .dayrun-foot-n { flex: none; font-size: 40px; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; }
      </style>
      <div id="root" data-composition-id="dayrun" data-width="1920" data-height="1080">
        <div id="dayrun-chapter" class="soft-raised soft-muted">Day Run</div>

        <div id="dayrun-card-float">
          <div id="dayrun-card" class="soft-raised">
            <div class="dayrun-head">
              <div id="dayrun-chip" class="soft-well"><svg viewBox="0 0 26 26"><path class="dayrun-play" d="M 7 4 L 22 13 L 7 22 Z"/></svg>Day Run</div>
              <div class="soft-small">tomorrow, played</div>
            </div>
            <div class="dayrun-stars">
              <div class="dayrun-star soft-raised" id="dayrun-star0"><svg viewBox="0 0 62 62"><path d="M 31 5 L 38.6 22.2 L 57.3 24.1 L 43.3 36.6 L 47.4 55 L 31 45.4 L 14.6 55 L 18.7 36.6 L 4.7 24.1 L 23.4 22.2 Z"/></svg></div>
              <div class="dayrun-star soft-raised" id="dayrun-star1"><svg viewBox="0 0 62 62"><path d="M 31 5 L 38.6 22.2 L 57.3 24.1 L 43.3 36.6 L 47.4 55 L 31 45.4 L 14.6 55 L 18.7 36.6 L 4.7 24.1 L 23.4 22.2 Z"/></svg></div>
              <div class="dayrun-star soft-raised" id="dayrun-star2"><svg viewBox="0 0 62 62"><path d="M 31 5 L 38.6 22.2 L 57.3 24.1 L 43.3 36.6 L 47.4 55 L 31 45.4 L 14.6 55 L 18.7 36.6 L 4.7 24.1 L 23.4 22.2 Z"/></svg></div>
            </div>
            <div class="dayrun-foot"><div class="soft-small">every walk routed, every class on time</div><div class="dayrun-foot-n" id="dayrun-foot-n">3 / 3</div></div>
          </div>
        </div>
      </div>
      <script>
        (function () {
          // Local time: 0 = scene start. Line starts come from film.json ("dayrun"): absolute 174.472 / 181.376,
          // durations 6.504 / 6.264; the scene lasts 14.368 s.
          const L0 = 0, D0 = 6.504, L1 = 181.376 - 174.472, D1 = 6.264, END = 14.368;
          const tl = gsap.timeline({ paused: true });

          tl.fromTo("#dayrun-chapter", { opacity: 0, y: -12 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.2);

          // Ambient: the card breathes.
          const period = 4.2, n = Math.max(0, Math.floor(END / period) - 1);
          tl.fromTo("#dayrun-card-float", { y: 0 }, { y: -6, duration: period / 2, ease: "sine.inOut", yoyo: true, repeat: 2 * n + 1 }, 0);

          // ---- Line 0: "Day Run lets you play tomorrow": the card arrives; three stars pop in, one per beat. ----
          tl.fromTo("#dayrun-card", { opacity: 0, y: 36, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.7, ease: "power3.out" }, L0 + 0.22 * D0);
          tl.fromTo("#dayrun-chip", { scale: 0.8 }, { scale: 1, duration: 0.6, ease: "power3.out" }, L0 + 0.22 * D0 + 0.1);
          const STAR_AT = L0 + 0.42 * D0;
          for (let i = 0; i < 3; i++) {
            tl.fromTo("#dayrun-star" + i, { opacity: 0, scale: 0, y: 14 }, { opacity: 1, scale: 1, y: 0, duration: 0.6, ease: "power3.out" }, STAR_AT + i * 0.55);
          }
          const score = { v: 0 }, foot = document.getElementById("dayrun-foot-n");
          tl.fromTo(".dayrun-foot", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, STAR_AT);
          tl.to(score, { v: 3, duration: 1.1 + 0.3, ease: "none", onUpdate: () => { foot.textContent = Math.round(score.v) + " / 3"; } }, STAR_AT + 0.3);

          // ---- Line 1: the thesis: the overlay fades to nothing and the world carries the frame. ----
          tl.to("#dayrun-card", { opacity: 0, y: -18, duration: 0.8, ease: "power2.in" }, L1 + 0.5);
          tl.to("#dayrun-chapter", { opacity: 0, duration: 0.6, ease: "power2.in" }, L1 + 0.9);

          window.__timelines["dayrun"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
