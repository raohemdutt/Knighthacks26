# An inspection operator at a plant. The box sits in the control room; the day is a shift of robot missions.
# Only the words change: the shared screens say "plant", "inspection", "mission" and "work order".
# The inspection dashboard itself is at /spot/ (contexts/spot) and does not depend on this profile.
name: inspection
description: A plant operator who follows a robot's inspection missions and hands work orders to the next shift.
audience: one operator per shift

vocabulary:
  workplace: plant          # where the box watches
  activity: inspection      # the main activity
  event: mission            # the fixed block on the calendar
  deadline: work order      # something due
  plurals:
    deadline: work orders

meters:
  habits: []                # all of the base habits; none are inspection-specific
  dayrun: []

# The Ask screen's suggested questions, in the operator's words (the student's when a profile lists none).
suggestions:
  - "Where did I leave my keys?"
  - "Which work orders are due this week?"
  - "What happened at the plant overnight?"
  - "How's your day?"
  - "Tell me a joke"
  - "I'm tired after this shift"
