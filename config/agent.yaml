# Agent settings.
# "Overnight" questions cover bedtime to wake. Adjust to the household's sleep schedule.
sleep:
  timezone: America/New_York
  bedtime: "20:00"
  wake: "08:00"

# Conversation: small talk and simple questions ("how's your day?", "tell me a joke") get a short spoken reply
# instead of a memory search. Every key is optional; these are the defaults. ATLAS_TALK=0 switches it off too.
# talk:
#   enabled: true
#   name: Atlas            # what it calls itself
#   tone: ""               # one more line for its persona, e.g. "Dry humour, very brief."
#   max_history_turns: 6   # exchanges kept in memory for follow-ups ("why?", "tell me another"); never logged
#   history_ttl_s: 600     # a conversation this quiet is forgotten

# Subreddit the agent searches for "what do students say" questions.
subreddit: ucf

# Who the always-on loop offers to message when a package sits at an empty home (A7). null = off.
notify_on_package: null  # e.g. dom

# People the agent may message (send_message, after approval): name -> ntfy topic.
people:
  dom: atlas-dom
  hemdutt: atlas-hemdutt
  xander: atlas-xander
  ilan: atlas-ilan

# Waste Watch: when nudges were switched on, for the before/after diversion rate.
impact:
  nudges_on_at: null  # e.g. "2026-10-11T12:00:00-04:00"; null = from the first "sort_right" nudge

# Sort It: which camera sees the bins, and where the player starts (normalized x, y).
play:
  camera: cam-door
  start_xy: [0.75, 0.75]

# Circle (G1): who this box speaks for, and which circle it negotiates in. Leave empty to turn off.
circle:
  member_id: null   # e.g. dom
  circle_id: null   # e.g. team
  share_presence: false  # opt in to sharing a named place (G5)
  chat_group: friends    # GroupMe group told when the circle agrees on an event (G1)
  emails: {}             # member id -> email, for calendar invites, e.g. {hemdutt: hemdutt@example.edu}
  share_summaries: false # opt in to sending habit/impact/game summaries to the Circle's leaderboards (E2)
  face_share: false      # let named friends' boxes recognise you (your own face template, sealed to their box, after a
                         # card on each side). Off: nothing is published and the endpoints answer 409. Also ATLAS_CIRCLE_FACE_SHARE=1
  face_share_days: 30    # a shared template is deleted on the friend's box after this many days unless renewed
  keep_days: 30          # this box removes its OWN plan messages, share receipts and expired place from the shared
                         # database after this many days (never anyone else's rows). 0: never remove anything
  names:                 # member id -> display name; also who must say yes to a plan with no invitees (G1)
    dom: Dominick
    hemdutt: Hemdutt
    xander: Xander
    ilan: Ilan

# Named places presence may use. Coarse spots only; never coordinates.
places: [Our table, Library, Dorm, Student Union, Gym]

# Leaving checklist (A8): where the box is, as a place-pack place, for walking time to the next event.
leaving:
  home_place: apartment.door   # e.g. ucf.eng2 when the box sits at the Knight Hacks table

# The coach feeds the learning loop (contexts/day/application/coach_feedback.py): after this many "Was that right?"
# answers about one kind of break (phone, food, someone coming in), of which at least `min_negatives` said "no",
# the coach proposes a teach task as an approval card. Nothing leaves the box unless the card is approved.
coach_feedback:
  min_corrections: 5
  min_negatives: 2

# The day's unasked speech (contexts/day/domain/arbiter.py, contexts/day/domain/reminders.py). The defaults below
# hold without this block; uncomment to change one.
# day:
#   speak_gap_s: 90         # the least time between two unasked lines (leave now / late and room alerts break it)
#   speak_stale_s: 120      # a line held that long behind another is dropped (a plan, a card, a check-in, a review wait)
#   block_reminders: true   # say once when a planned block starts
#   speaker: box            # the box's own speaker says the unasked lines and the phone stays silent (default: the phone)
#   suggest_optional: true    # bring up an optional "Near you" event that fits or nearly fits and names somebody, once
#   suggest_from_min: 90      # ... not earlier than this many minutes before it starts
#   suggest_until_min: 30     # ... and not later than this
#   suggest_cooldown_min: 45  # the least time between two such suggestions
