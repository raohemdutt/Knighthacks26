# Connectors (K1). Each one is an MCP server run as `python -m <module>`.
# reads: tool -> item kind, synced every `every_s` seconds into connector.item.synced.
# writes: tools with an outside effect; they only run after an approval card.
# Tokens live in .env and are listed by name under `env`; never put them here.

site:
  module: contexts.connectors.servers.site
  every_s: 300
  hosts: [knighthacks.org]
  reads: {check_pages: page_change}
  options:
    state_dir: data/connectors/site
    pages:
      - {title: "Knight Hacks schedule", url: "https://knighthacks.org"}
      # - {title: "School page", url: "https://..."}

calendar:
  # Published .ics feeds (K2 reads, K3 campus events, K6 Canvas fallback).
  # Each feed URL is a bearer credential: put it in .env and name it here. A feed whose
  # URL is not set on this box is skipped.
  module: contexts.connectors.servers.ics
  every_s: 600
  hosts: [outlook.office365.com, ufl.instructure.com, events.ucf.edu]
  reads: {list_events: calendar_event}
  writes: [create_event]  # .ics invites (Graph fallback); runs only after an approval card
  env: [OUTLOOK_ICS_URL, CAMPUS_EVENTS_ICS_URL, CANVAS_ICS_URL]
  options:
    invites_dir: data/invites
    days_back: 1
    days_ahead: 14
    feeds:
      - {name: outlook, url_env: OUTLOOK_ICS_URL, kind: calendar_event}
      - {name: campus, url: "https://events.ucf.edu/upcoming/feed.ics", kind: calendar_event}  # K3: public UCF events feed
      - {name: canvas, url_env: CANVAS_ICS_URL, kind: assignment}  # K6: assignments and due dates

browser:
  # K7: patchright search, Reddit and page reading as on-demand Agent tools.
  # Headful passes DuckDuckGo and Reddit bot checks; on the Jetson run under Xvfb.
  module: contexts.connectors.servers.browser
  # "*": read almost any website (the egress firewall opens the web ports for this connector only when online);
  # the named ones are listed for the Privacy screen.
  hosts: [html.duckduckgo.com, www.bing.com, www.reddit.com, "*"]
  tools: [search, reddit, browse]
  writes: [submit_form]  # RSVPs, room bookings: only after an approval card
  env: [DISPLAY, WAYLAND_DISPLAY]  # the Jetson's Xvfb display (atlas-xvfb.service, DISPLAY=:99 in .env); without one it runs headless
  options:
    headless: false
    channel: auto  # installed Chrome if present, else patchright's Chromium
    locale: en-US
    timezone: America/New_York
    min_gap_s: 2
    profile_dir: data/browser/profile
    allowed_hosts: ["*"]
    max_chars: 6000

groupme:
  # K4. One bot per group. Reads the live groups when GROUPME_ACCESS_TOKEN is set;
  # otherwise reads back what our own bots posted (bots cannot read).
  module: contexts.connectors.servers.groupme
  every_s: 120
  hosts: [api.groupme.com]
  reads: {list_messages: message}
  writes: [post]
  env: [GROUPME_BOT_CLASS, GROUPME_BOT_FRIENDS, GROUPME_ACCESS_TOKEN]
  options:
    state_dir: data/connectors/groupme
    limit: 50
    groups:
      - {key: class, name: "COP4533 group chat", bot_env: GROUPME_BOT_CLASS, group_id: "118084819"}
      - {key: friends, name: "Friends group chat", bot_env: GROUPME_BOT_FRIENDS, group_id: "118084823"}

health:
  # K9: last night's sleep from a watch (time asleep, stages, resting heart rate, HRV, breathing rate), one item
  # per night, read from the FreeReps database on the Raspberry Pi with a read-only role. Habits uses the
  # measured sleep instead of the empty-desk estimate. Raw health data stays on the box.
  # Does nothing (no items, no errors) until FREEREPS_DATABASE_URL is in .env, or `export_dir` or `fixture` is set.
  # The database needs the Postgres driver: pip install -e ".[neon]". The export and the fixture need nothing.
  #
  # The demo box has no tailnet and no live database: it reads the export. To turn that on, set
  #     export_dir: fixtures/watch
  #     export_rebase: true
  # Privacy: fixtures/watch is one teammate's (Dominick's) real Apple Watch history, shared with the team by his
  # decision. The items made from it stay on the box: Memory and Habits get them, nothing is queued for the
  # Circle, and they are not in the training export (contexts/circle/tests/test_health_privacy.py,
  # contexts/learning/tests/test_export.py). Do not copy its numbers into events, logs, Notion or slides.
  module: contexts.connectors.servers.health
  every_s: 1800
  hosts: []  # add the Pi's tailnet address here so the firewall lets this connector reach it
  reads: {list_nights: health}
  env: [FREEREPS_DATABASE_URL]
  options:
    days: 7
    watch_sources: ["Apple Watch"]  # a stage row that names a source must contain one of these ("Dominick’s Apple Watch");
                                    # rows with an empty source are kept, `In Bed` rows never are; [] takes any source
    export_dir: null       # a folder of FreeReps tables as .csv.gz (`python -m watch pull`), read when the database
                           # is not set or not reachable: stage intervals where it has them, else its sleep_sessions
    export_rebase: false   # true: move the export's dates so its newest night is last night (demos)
    export_in_bed_nights: false  # true: also count the phone's In Bed-only rows (2020 to 2025) as nights, time in bed as sleep
    fixture: null          # a file in the tables' shapes, read when the database is not set or not reachable
                           # (fixtures/health/freereps.yaml is a synthetic week)
    fixture_rebase: false  # true: move the file's dates so its last day is today (demos)

# canvas (Hemdutt: K6) goes here.

places:
  # K8: restaurants, cafes and dining halls near the box, from OpenStreetMap (Overpass API,
  # no key; cached a day). The location is a fixed setting, never live GPS.
  module: contexts.connectors.servers.places
  hosts: [overpass-api.de, overpass.kumi.systems, overpass.private.coffee]
  tools: [nearby]
  options:
    lat: 28.6024   # UCF main campus; set to where the box sits
    lon: -81.2001
    cache_dir: data/connectors/places
