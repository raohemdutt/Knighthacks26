# The demo night as a script (contexts/demo): the same story as fixtures/memory/memory.yaml, written as
# what the cameras and connectors would have published, so replaying it fills every projection.
# Times are America/New_York; `python -m contexts.demo seed --now` moves the whole story so `now` is now.
#
# items: one `connector.item.synced` each, published at `synced`.
# beats: one burst of camera activity each (about one Memory episode per beat).
#   move      sit    people seated in the desk zone for `seconds` (sampled every 2 s: this is focus time)
#             arrive people walk in through the door zone       leave  people walk out through it
#             pass   people stand in the door zone for `seconds`
#             bins   a person stands by the bins while `toss` items go in
#             none   nobody in view
#   carrying  labels in the first person's hands (never inside a zone)
#   things    labels on the desk for the first frames (not can/cup/bottle: Waste Watch counts every track
#             with those labels as a new item, and a can on the desk camera is never seen entering a bin)
#   package   seconds a package sits in the door zone (5 or more raises the package-at-door alert)
#   toss      [{label, bin}]: items carried into a bin zone; Waste Watch decides whether the bin was right
#   faces     seconds the people look at the camera before the toss (`perception.faces.counted`): 2 or more
#             starts a Sort It round, and the game's first item is the first one in config/sorting.yaml
#   captions  `perception.scene.described` for the whole frame (Habits reads meal and energy drink words
#             in desk captions: see config/habits.yaml before rewording one)
#   objects   `perception.scene.described` for a zone crop (`zone`, the desk by default): Memory's
#             sightings, and for the desk the full list of watch items Habits thinks are on it
